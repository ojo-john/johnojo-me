        dates: May – Aug 2022
        start: 2022-05
        end: 2022-08
        bullets:
          - Migrated a legacy service onto native AWS, using Lambda with API Gateway as the compute platform.
          - Created and delegated the service's DNS hosted zone.
          - Ran end-to-end testing before onboarding internal and external clients.
      - title: First internship · FAQ chatbot
        dates: Jun – Aug 2021
        start: 2021-06
        end: 2021-08
        bullets:
          - Built a chatbot with Amazon Lex and QnABot that answered common customer questions automatically, reducing the load on the people answering them.
          - Built the chat interface with the Lex Web UI and Angular so users could talk to the bot.

