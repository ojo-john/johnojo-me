summary: "A day trip from Rome, and it was alright. I spent about two hours each in Amalfi and Positano. They're small towns built into the cliffs, and beyond walking around and taking in the view there isn't much to do. Positano's beach also wasn't the beach I expected: it's pebbles, not sand."
liked: The boat along the coast and the views of the towns from the water.
disliked: Not much to do, and a pebble beach instead of sand.
