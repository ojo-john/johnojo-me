summary: "My first solo trip. The food was amazing and so cheap. I did a wine tasting in the Douro Valley and went ATV riding, where one of the ATVs actually caught fire. That aside, it was a 9/10 trip."
highlights:
  Food: Amazing, and very cheap
  Activities: Douro Valley wine tasting and an ATV ride
  Standout moment: One of the ATVs caught fire
