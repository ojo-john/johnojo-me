highlights:
  Food: "The buffet at Suuyar, a Nigerian suya spot on Peckham Rye. Really good."
  Football: "Chelsea 2–0 Manchester United at Stamford Bridge, the highlight of the trip"
matches:
  - home: Chelsea
    away: Manchester United
    score: 2–0
    competition: Premier League
    date: 2026-10-31
    stadium: Stamford Bridge
    writeUp: "The highlight of my whole trip. The first half was a struggle: we couldn't get going, and Fofana kept making mistakes at the back. After the break it was a different team, and we played United off the park. Morgan Rogers broke the deadlock in the 50th minute, Lisandro Martínez was sent off in the 63rd, and Cole Palmer put the penalty away a minute later to send Chelsea back into the top four."
