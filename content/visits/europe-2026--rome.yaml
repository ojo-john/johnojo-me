matches:
  - home: Roma
    away: Cagliari
    score: 4–2
    competition: Serie A
    date: 2026-10-27
    stadium: Stadio Olimpico
    writeUp: "The best game I've been to so far for goals and action. Cagliari went ahead in the 8th minute: VAR spotted a Pisilli handball and Nzola scored the penalty. Lulli headed Roma level, and Pisilli made up for it by turning in Lulli's cross to make it 2–1 inside 21 minutes. Maldini equalised in the 81st, then two of Roma's subs won it late: Mora with a header in the 85th and Malen in the 87th. I absolutely loved the football Cagliari played, and Roma's number 3 caught my eye: one to watch."
