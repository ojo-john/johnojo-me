depart: 2026-10-29
summary: "I didn't enjoy Rome as much as Milan. Part of that is probably where I stayed: San Giovanni, outside the centre. In Milan I got everywhere on the metro. In Rome it was mostly buses, and it's the only city so far where I've had to take Ubers and taxis, which I normally try to avoid. The days were still full: Roma beat Cagliari 4–2 at the Olimpico, then the Vatican, the Colosseum and a food tour through Trastevere."
highlights:
  Football: "Roma 4–2 Cagliari at the Stadio Olimpico, the best game I've been to for goals and action"
  History: The Vatican, the Colosseum and the Roman Forum
  Food: A food tour through Trastevere
disliked: Staying outside the centre, and needing buses, Ubers and taxis to get around.
wouldReturn:
  answer: "yes"
  why: "And I'd stay near the centre next time. I feel like I missed some things by staying out in San Giovanni."
