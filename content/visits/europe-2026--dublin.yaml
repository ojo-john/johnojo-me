summary: "I spent two days in Dublin with my cousins, and I liked it. I wish I'd stayed longer to explore, with things like the Guinness Storehouse tour at St. James's Gate, and maybe a drive out west to the Atlantic coast: the Cliffs of Moher, Galway and Connemara's mountains and coastline."
liked: "Spending it with my cousins"
