summary: "Marseille was a rest stop. I didn't do much, and there didn't seem to be much to do anyway. The seafood was amazing, though. I walked up to Notre-Dame de la Garde, the basilica on the hill. It's a tough climb, but the views were worth it. Marseille also has the easiest public transport I've ever used: just two metro lines, and I didn't get lost once."
highlights:
  Food: Amazing seafood
  Views: Walking up to Notre-Dame de la Garde
  Football: A tour of the Stade Vélodrome
moments:
  - date: 2026-10-20
    title: "The Old Port"
    note: "My first afternoon, around the Vieux-Port and the church of Saint-Ferréol les Augustins on the harbour. Nearby, a signed photo of Eric Cantona: he was born in Marseille and played for Olympique de Marseille, his boyhood club, before he became a Manchester United legend."
    media: [photos/img-0905, photos/img-0909]
  - date: 2026-10-21
    title: "Sunset at Notre-Dame de la Garde"
    note: "The basilica sits on the highest point in Marseille. It's a steep climb, but the view over the city and the sea at sunset was worth it."
    media: [photos/img-0914, photos/img-0921, photos/img-0925, photos/img-0942]
  - date: 2026-10-21
    title: "Seafood by the Old Port"
    media: [photos/img-0943]
  - date: 2026-10-22
    title: "Stade Vélodrome tour"
    note: "Home of Olympique de Marseille. The tour takes you down the players' tunnel and past plaques of club legends like Habib Beye."
    media: [videos/img-0949, videos/img-0952, videos/img-0958, photos/img-0948, photos/img-0963, photos/img-0966]
