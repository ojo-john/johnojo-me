summary: "Marseille was a rest stop. I didn't do much, and there didn't seem to be much to do anyway. The seafood was amazing, though. I walked up to Notre-Dame de la Garde, the basilica on the hill. It's a tough climb, but the views were worth it. Marseille also has the easiest public transport I've ever used: just two metro lines, and I didn't get lost once."
