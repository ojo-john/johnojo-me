summary: "Marseille was a rest stop. I didn't do much, and there didn't seem to be much to do anyway. The seafood was amazing, though. I walked up to Notre-Dame de la Garde, the basilica on the hill. It's a tough climb, but the views were worth it, and the weather was nice. Marseille also has the easiest public transport I've ever used. There are only two metro lines, M1 (La Rose to La Fourragère) and M2 (Gèze to Sainte-Marguerite Dromel), and I didn't get lost once."
highlights:
