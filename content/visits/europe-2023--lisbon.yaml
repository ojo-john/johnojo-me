summary: Lisbon was amazing. The food was good, the weather was good, the transport was easy to understand and the people were welcoming. Fun fact. I arrived at 2am with no idea where my Airbnb was, because the addresses were so confusing. Thankfully someone on the street happened to speak English and pointed me the right way. I stopped using Airbnb after that.
highlights:
  Food: Good food, plus a Portuguese food and wine tour
  Standout moment: Lost at 2am until a stranger helped me find my Airbnb
liked: The food, the weather, easy transport and welcoming people.
