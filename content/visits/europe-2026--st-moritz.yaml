arrive: 2026-10-26
summary: "St. Moritz was great. The food was expensive, though: I paid $50 for burgers and fries, which I never imagined. The highlight was the train over the Bernina Pass. The mountain views were amazing, but all I could think about was the engineering. The line was finished in 1910, long before today's technology, and it's now a UNESCO World Heritage Site. That they built it at all is astonishing."
highlights:
  Activities: The Bernina train over the Alps
  Views: Lake St. Moritz and the snowy peaks
liked: The train ride, the mountain views and the engineering behind the railway.
disliked: "Expensive food: $50 for burgers and fries."
moments:
  - date: 2026-10-26
    title: "The way up from Italy"
    note: "By coach from Milan through Chiavenna, then up over the Maloja Pass into Switzerland."
    media: [photos/img-1269]
  - date: 2026-10-26
    title: "Lake St. Moritz"
    note: "St. Moritz has hosted the Winter Olympics twice, in 1928 and 1948. In winter the lake freezes hard enough for horse racing and polo on the ice."
    media: [photos/img-1299, videos/img-1292, photos/img-1302]
  - date: 2026-10-26
    title: "Above the town"
    note: "The town sits at about 1,800 metres, and in late October the larch trees turn gold."
    media: [photos/img-1321, videos/img-1329]
  - date: 2026-10-26
    title: "The train over the Bernina Pass"
    note: "The Bernina line was finished in 1910 and is part of a UNESCO World Heritage Site. It climbs past glaciers to Lago Bianco, at 2,253 metres the highest point on the line, then winds down through Brusio towards Italy."
    media: [videos/img-1350, videos/img-1339, videos/img-1371]
