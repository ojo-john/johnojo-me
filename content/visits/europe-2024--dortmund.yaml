    writeUp: I was in the Leverkusen end, which was an experience in itself. I found out the hard way that you're not allowed to film the ultras. A fan with a Victor Boniface phone case got chatting to me once he found out I'm Nigerian. I got to watch Xabi Alonso's Leverkusen, and they did it again. Füllkrug put Dortmund ahead in the 81st minute, then Josip Stanišić headed in a 97th-minute equaliser to keep their unbeaten season alive. Another last-minute goal.
