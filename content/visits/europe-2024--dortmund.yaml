    writeUp: "I ended up in the Leverkusen end, which was an experience in itself, and found out the hard way that you're not allowed to film the ultras. One fan had a Victor Boniface phone case, and we got talking once they found out I'm Nigerian. I also got to watch Xabi Alonso's Leverkusen do it again. Füllkrug put Dortmund ahead in the 81st minute, then Josip Stanišić headed in a 97th-minute equaliser to keep their unbeaten season going. Another last-minute goal."
