summary: "My friend's 22nd birthday trip: dinner, ATV riding and time on the beach. It was also the first place I've been racially profiled. At the airport I was accused of carrying drugs and told to show where they were, and on the streets people kept coming up to offer me drugs. Then someone collapsed during the birthday dinner, and the ambulance took more than 30 minutes to arrive."
disliked: "Being racially profiled at the airport, being offered drugs on the street, and waiting over 30 minutes for an ambulance."
highlights:
