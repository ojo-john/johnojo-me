summary: "My friend's 22nd birthday trip: dinner, ATV riding and the beach. It was also the first place I'd ever been racially profiled. At the airport I was accused of carrying drugs and told to show where they were. Out on the streets, people kept coming up to me offering drugs. Then, during the birthday dinner, someone collapsed, and the ambulance took more than 30 minutes to arrive."
disliked: "Being racially profiled at the airport, being offered drugs on the street, and waiting over 30 minutes for an ambulance."
