summary: "My friend's 22nd birthday trip. ATV riding was the highlight, and our Airbnb was really cool, with great views. It was my first time meeting the people on the trip, and it was great vibes. It was also the first place I'd ever been racially profiled. At the airport I was accused of carrying drugs and told to show where they were. Out on the streets, people kept coming up to me offering drugs. Then, during the birthday dinner, someone collapsed, and the ambulance took more than 30 minutes to arrive. Honestly, after that dinner I just wanted to leave."
disliked: "Being racially profiled at the airport, being offered drugs on the street, and waiting over 30 minutes for an ambulance."
liked: "ATV riding, our Airbnb's views and the people on the trip."
highlights:
  Activities: ATV riding, the best part of the trip
  Stay: An Airbnb with great views
wouldReturn:
  answer: "no"
  why: "Never going back."
