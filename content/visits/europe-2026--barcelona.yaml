summary: >-
  Barcelona was amazing, and way better than Madrid. The food was good and the people were friendly.
  I got a bit lost a couple of times, but I learnt quickly, and it's extremely walkable. My first night
  was great, watching a flamenco show. I love learning about cultures. I also learnt how to make paella
  at a cooking class, which was a good experience.
highlights:
  Culture: A flamenco show on my first night
  Food: Learning to make paella at a cooking class
  Sights: Park Güell and the Sagrada Família
liked: Good food, friendly people, and it's extremely walkable.
disliked: I got lost a couple of times at first, and the Espanyol game was very boring.
