summary: "Barcelona was amazing, way better than Madrid. Good food, friendly people, and it's so walkable. I got lost a couple of times but figured it out quickly. My first night was a flamenco show, which was great. I love learning about other cultures. I also learnt to make paella at a cooking class, which was a really good experience."
highlights:
  Culture: A flamenco show on my first night
  Food: Learning to make paella at a cooking class
  Sights: Park Güell and the Sagrada Família
liked: "Good food, friendly people and how walkable it is."
disliked: "Getting lost a couple of times early on, and a very boring Espanyol game."
