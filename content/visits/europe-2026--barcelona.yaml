summary: "Barcelona was amazing, way better than Madrid. Good food, friendly people, and it's so walkable. I got lost a couple of times, but I figured it out quickly. On my first night I saw a flamenco show. I love learning about other cultures, so it was the perfect start. I also learnt to make paella at a cooking class."
highlights:
  Culture: A flamenco show on my first night
  Food: Learning to make paella at a cooking class
  Sights: Park Güell and the Sagrada Família
