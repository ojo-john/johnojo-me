summary: "Barcelona was amazing, way better than Madrid. Good food, friendly people, and it's so walkable. I got lost a couple of times, but I figured it out quickly. On my first night I saw a flamenco show and loved it, because I love learning about other cultures. I also learnt to make paella at a cooking class."
