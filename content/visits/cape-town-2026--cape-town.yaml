trip: cape-town-2026
destination: cape-town
order: 1
summary: "I came for my cousin's wedding and spent most of the trip in Stellenbosch. The plan was to land a few days early and see Cape Town properly, but United delayed my flight, then cancelled it, and there wasn't another one for two days. By the time I landed, it was time for the wedding."
liked: "The vineyards around Stellenbosch."
disliked: "It didn't feel safe: my cousins had things stolen from their hotel, and someone was robbed at knifepoint. The flight is close to a full day of travel each way."
wouldReturn:
  answer: "yes"
  why: "Only if I fly business. It's close to a full day of travel each way."
notRanked: "I spent nearly all of this trip in Stellenbosch and barely saw Cape Town itself."
