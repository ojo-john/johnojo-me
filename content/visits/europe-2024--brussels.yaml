  - date: 2024-04-10
    title: "Chocolate, beer, waffle and whiskey tour"
    note: "A small-group walking tour of the old town: chocolate tastings, Manneken Pis (who gets dressed in a different costume several times a week), the Town Hall and the Grand-Place, then Belgian beers."
