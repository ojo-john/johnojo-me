summary: "We did the Flagstaff Extreme Adventure Course at Fort Tuthill County Park, a mix of ropes and zip lines up in the pines. There was snow on the ground, but it wasn't too cold, which made it perfect weather for the course. I was definitely the best on it. I won't say who was the worst. I'd love to do another one in a different city or country."
