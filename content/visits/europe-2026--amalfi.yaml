summary: "A day trip from Rome, and it was alright. I spent about two hours each in Amalfi and Positano. They're small towns built into the cliffs, and beyond walking around and taking in the view there isn't much to do."
liked: The boat along the coast and the views of the towns from the water.
disliked: Not much to do.
moments:
