name: FPL Decision Engine
order: 1
status: published
kind: case-study
stage: Live
summary: A decision-support system for a Fantasy Premier League manager in a head-to-head league. It ingests player and fixture data, versions the game's rules and won't make recommendations from bad data.
problem: Public FPL data is inconsistent and the game's rules change between seasons. Recommendations are only as good as the data under them.
approach: A resilient API client with retries and health classification, versioned rules snapshots, normalised ingestion into Postgres, and a data-quality gate that blocks optimisation when checks fail.
stack: [Python 3.12, FastAPI, SQLAlchemy 2.0, Alembic, PostgreSQL, Next.js, Docker Compose, GitHub Actions]
repo: https://github.com/ojo-john/fpl-decision-engine
demo: https://fpl-decision-engine-chi.vercel.app
demoNote: Sign-in required
diagram:
  - { label: FPL public API, note: "External, rate-limited and occasionally inconsistent." }
  - { label: Resilient client, note: "Retries with backoff, health classification and response fingerprinting." }
  - { label: Rules versioning, note: "Rules are read from bootstrap data and stored as versioned snapshots." }
  - { label: Ingestion jobs, note: "Normalise teams, players, gameweeks and fixtures with upserts." }
  - { label: Data-quality gate, note: "Scores the data and blocks optimisation when checks fail." }
  - { label: PostgreSQL, note: "SQLAlchemy 2.0 models with hand-written Alembic migrations." }
