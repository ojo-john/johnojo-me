name: CodeQuest
order: 2
status: published
kind: project
stage: Live
summary: I turned my own Java interview prep into a game. You solve challenges by writing real Java in the browser, and it runs in an isolated sandbox and gets graded instantly.
problem: Interview prep is a grind and easy to drop. I wanted to make practising Java feel like a game I'd actually come back to, and run it for as close to nothing as possible.
approach: Code runs in a locked-down sandbox built from a pinned runner image, JUnit and contract tests grade every answer, and job and CPU budgets keep it inside free and hobby tiers.
stack: [Next.js 16, TypeScript, Supabase / PostgreSQL, Vercel Sandbox, Vitest]
repo: https://github.com/ojo-john/codequest
demo: https://codequest-zeta-self.vercel.app
demoNote: Sign-in required
diagram:
  - { label: Browser editor, note: "I write real Java in the browser and submit it." }
  - { label: Next.js API, note: "Validates the source and checks I'm signed in before anything runs." }
  - { label: Budget gate, note: "Daily and monthly job caps, a CPU-seconds budget and one job at a time keep it on free tiers." }
  - { label: Vercel Sandbox, note: "A fresh, throwaway VM from a pinned runner image. No network, no credentials, no root." }
  - { label: Grading, note: "JUnit and method contracts. Expected answers never enter the sandbox; the server compares results." }
  - { label: Supabase, note: "Attempts, skill progress and an XP ledger in Postgres, with row-level security on every table." }
