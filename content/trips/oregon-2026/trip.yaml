intro: "A four-day road trip: Portland to the coast at Cannon Beach, down the Oregon Coast to Cape Perpetua, then inland to Crater Lake, stopping at Silver Falls on the drive back. I loved the driving, and the exercise that comes with the hikes, but the views themselves were just alright. Maybe I'm not a big nature person."
