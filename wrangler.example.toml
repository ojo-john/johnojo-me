# Template for the Cloudflare Pages project's settings, including the site-metrics bindings.
# See docs/METRICS.md. Nothing here is live: this file is only an example.
#
# To use it, copy it to wrangler.toml and fill in the <placeholders>. Note that once a wrangler.toml is
# in the repo, Cloudflare treats it as the source of truth and the same settings become read-only in
# the dashboard. Prefer the dashboard? Enter the same values there and don't create wrangler.toml.
#
# Never put secrets in this file. CF_API_TOKEN is a secret: set it with
#   npx wrangler pages secret put CF_API_TOKEN --project-name johnojo-me
# or in the dashboard (Settings → Variables and secrets → type "Secret").

name = "johnojo-me"
pages_build_output_dir = "out"
compatibility_date = "2026-10-01"

[vars]
# "true" turns on collecting (/api/collect) and reading (/api/metrics). Anything else switches both off.
METRICS_ENABLED = "true"
# Must match the dataset below.
METRICS_DATASET = "johnojo_metrics"
# Hosts allowed to send events.
METRICS_ALLOWED_HOSTS = "johnojo.me,www.johnojo.me"
# Your Cloudflare account id (dashboard → right-hand side of the account home page). Not a secret.
CF_ACCOUNT_ID = "<account id>"
# Cloudflare Access: team domain and the Application Audience (AUD) tag of the "johnojo.me admin" app.
ACCESS_TEAM_DOMAIN = "<team>.cloudflareaccess.com"
ACCESS_AUD = "<64-character AUD tag>"
# Build-time switch for the tracker in the site's pages. Set it in the Pages build environment too.
NEXT_PUBLIC_METRICS = "1"

# Workers Analytics Engine: where events are counted. Created automatically on the first write.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "johnojo_metrics"
