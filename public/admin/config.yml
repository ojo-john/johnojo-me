# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.252.0/schema/sveltia-cms.json
# Editor configuration for johnojo.me (Sveltia CMS).
# Every form below writes the same YAML / MDX files the site builds from, so nothing here is a separate database.
# Locally: run `npm run dev`, open http://localhost:3000/admin/editor/ in Chrome and choose
# "Work with Local Repository". Online: sign in with GitHub (see docs/DEPLOY.md, "The editor online").
#
# The fields mirror src/lib/content/schema.ts. tests/admin-config.test.ts fails the test run if the two
# drift apart (a field missing here, a field the schema doesn't know, required/optional or options that
# don't match), so when you change the schema, change this file in the same commit.

backend:
  name: github
  repo: ojo-john/johnojo-me # private GitHub repository holding this site; only people with write access can save
  branch: main
  # "Sign in with GitHub" goes through the site's own relay (functions/oauth/, docs/DEPLOY.md). Until the
  # GitHub OAuth app's ID and secret are set on Pages, the button says so; "Sign In Using Access Token" still works.
  base_url: https://johnojo.me
  auth_endpoint: oauth/auth

app_title: johnojo.me · Editor
logo:
  src: /admin/logo.svg
media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

output:
  # Leave blank optional fields out of the file instead of writing "" or null. The site treats a missing
  # field as "not filled in yet", and an empty string would fail checks such as dates and links.
  omit_empty_optional_fields: true

collections:
  # ---------------------------------------------------------------- Travel
  - name: trips
    label: Trips
    label_singular: Trip
    description: One entry per journey. Cities are added under "City visits".
    folder: content/trips
    path: "{{slug}}/trip"
    slug: "{{title}}"
    format: yaml
    extension: yaml
    identifier_field: title
    create: true
    summary: "{{title}} · {{status}}"
    sortable_fields: [year, title]
    fields:
      - { name: title, label: Title, hint: "e.g. Europe 2027. The web address is made from this when you first save, and doesn't change after." }
      - { name: year, label: Year, widget: number, value_type: int, step: -1 }
      - name: status
        label: Status
        widget: select
        default: draft
        hint: "Draft: only you see it, on your computer. Published: live for everyone. Coming soon is treated like Published for now."
        options:
          - { label: "Draft (hidden)", value: draft }
          - { label: Coming soon, value: coming-soon }
          - { label: Published, value: published }
      - { name: publishAt, label: Publish on, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: "Optional. Set Status to Published and pick a future day: it stays hidden until that morning, then appears on its own." }
      - name: kind
        label: Type
        widget: select
        required: false
        default: trip
        hint: "Trip: gets its own card on the Travel page. Match day: a one-off game; it shows under Match days and on the map, but not as a trip card."
        options:
          - { label: Trip, value: trip }
          - { label: Match day, value: match-day }
      - { name: start, label: Start date, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
      - { name: end, label: End date, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
      - { name: datesNote, label: Dates note, required: false, hint: "Shown when exact dates aren't known, e.g. Early April 2024" }
      - { name: style, label: Travel style, required: false, hint: "e.g. Solo · birthday trip" }
      - { name: theme, label: One-line theme, widget: text, required: false, hint: "One or two sentences that sum up the trip" }
      - { name: intro, label: Introduction, widget: text, required: false, hint: "A short paragraph at the top of the trip page" }
      - { name: cover, label: Cover photo, required: false, widget: cover-picker, scope: trip, hint: "Pick from every stop's photos. Leave blank to use the first city's cover." }
      - { name: coverFocus, label: Cover framing, required: false, widget: focus-picker, scope: trip, hint: "Click the part of the cover that must stay in view when it's cropped." }
      - name: awards
        label: Personal awards
        widget: list
        required: false
        summary: "{{fields.award}}"
        fields:
          - { name: award, label: Award, hint: "e.g. Best food" }
          - { name: visit, label: City visit id, required: false, pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Lowercase letters, numbers and hyphens only, e.g. porto"], hint: "the part after -- in the visit name, e.g. porto" }
      - name: verdict
        label: Final verdict
        widget: object
        required: false
        collapsed: auto
        fields:
          - { name: bestMoment, label: Best moment, widget: text, required: false }
          - { name: biggestSurprise, label: Biggest surprise, widget: text, required: false }
          - { name: wouldChange, label: What I'd change, widget: text, required: false }
          - { name: favouriteCity, label: Favourite city, required: false }
          - { name: wouldRepeat, label: "Would I repeat it?", required: false }

  - name: visits
    label: City visits
    label_singular: City visit
    description: A city on a particular trip. The same city on another trip gets its own visit, scores and photos.
    folder: content/visits
    format: yaml
    extension: yaml
    create: true
    slug: "{{trip}}--{{destination}}"
    summary: "{{trip}} · {{destination}}"
    sortable_fields: [trip, order]
    view_groups:
      - { label: Trip, field: trip }
    fields:
      - { name: trip, label: Trip, widget: relation, collection: trips, value_field: "{{slug}}", search_fields: [title], display_fields: [title], hint: "Pick the trip first. The file name is made from the trip and place when you first save." }
      - { name: destination, label: Place, widget: relation, collection: places, value_field: "{{slug}}", search_fields: [city, country], display_fields: ["{{city}}, {{country}}"], hint: "Not in the list? Add it under Places first." }
      - { name: order, label: Stop number, widget: number, value_type: int, min: 1, hint: "1 for the first city on the trip, 2 for the next…" }
      - name: kind
        label: Type of stop
        widget: select
        required: false
        default: city
        hint: "Leave blank for a normal city visit."
        options:
          - { label: City visit, value: city }
          - { label: Match day only, value: match-only }
          - { label: Day trip, value: day-trip }
      - name: status
        label: Status
        widget: select
        required: false
        default: published
        hint: "Leave blank to follow the trip. Draft hides just this city, even on a published trip."
        options: [{ label: "Draft (hidden)", value: draft }, { label: Published, value: published }]
      - { name: publishAt, label: Publish on, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: "Optional. Hides just this stop until that day, then it appears on its own." }
      - { name: photoFolder, label: Photo folder name, required: false, hint: "Only if the media folder isn't named after the city, e.g. nice + french riviera" }
      - { name: arrive, label: Arrived, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
      - { name: depart, label: Left, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
      - { name: summary, label: What I did, widget: text, required: false, hint: "A few lines in your own words" }
      - name: highlights
        label: Highlights
        widget: keyvalue
        required: false
        key_label: Label
        value_label: Text
        label_singular: highlight
        hint: "Label on the left (Food, Football, Architecture…), a short line on the right."
      - name: moments
        label: What I did (day by day)
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.date}} · {{fields.title}}"
        hint: "One row per thing you did, in order. Media: the photos/clips that show it, written like photos/img-0660 or videos/img-0489 (the names in Photos & videos)."
        fields:
          - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
          - { name: title, label: What, hint: "e.g. Flamenco show" }
          - { name: note, label: Short note, required: false }
          - { name: media, label: Photos and clips, widget: list, required: false, field: { name: ref, label: Photo or clip, widget: string } }
      - { name: liked, label: Liked, widget: text, required: false }
      - { name: disliked, label: Didn't like, widget: text, required: false }
      - name: wouldReturn
        label: Would I return?
        widget: object
        required: false
        fields:
          - { name: answer, label: Answer, widget: select, options: [yes, no, maybe] }
          - { name: why, label: Why, required: false }
      - { name: verdict, label: One-line verdict, required: false }
      - { name: notRanked, label: "Not ranked (why)", required: false, hint: "Only to leave this stop out of the rankings on purpose, e.g. I barely saw the city. Leave blank otherwise." }
      - name: rating
        label: Scores (0–10, leave blank if unsure)
        widget: object
        required: false
        collapsed: true
        hint: "Whole numbers from 0 to 10. A blank score is never counted as zero; the city is ranked once all ten are filled in."
        fields:
          - { name: ratedOn, label: Rated on, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
          - name: scores
            label: Scores
            widget: object
            fields:
              - { name: food, label: Food & Desserts, widget: number, value_type: int, min: 0, max: 10, required: false }
              - { name: value, label: Affordability & Value, widget: number, value_type: int, min: 0, max: 10, required: false }
              - { name: transport, label: "Public Transport (buses, trains, trams)", widget: number, value_type: int, min: 0, max: 10, required: false }
              - { name: walkability, label: Walkability, widget: number, value_type: int, min: 0, max: 10, required: false }
              - { name: architecture, label: Architecture & Beauty, widget: number, value_type: int, min: 0, max: 10, required: false }
              - { name: culture, label: Culture & Atmosphere, widget: number, value_type: int, min: 0, max: 10, required: false }
              - { name: people, label: People & Hospitality, widget: number, value_type: int, min: 0, max: 10, required: false }
              - { name: attractions, label: Attractions & Experiences, widget: number, value_type: int, min: 0, max: 10, required: false }
              - { name: safety, label: Safety & Comfort, widget: number, value_type: int, min: 0, max: 10, required: false }
              - { name: enjoyment, label: Overall Enjoyment, widget: number, value_type: int, min: 0, max: 10, required: false }
          - name: notes
            label: Short notes on scores (optional)
            widget: object
            required: false
            collapsed: true
            hint: "One line explaining a score, shown under it, e.g. Public Transport: Only used taxis."
            fields:
              - { name: food, label: Food & Desserts, required: false }
              - { name: value, label: Affordability & Value, required: false }
              - { name: transport, label: "Public Transport (buses, trains, trams)", required: false }
              - { name: walkability, label: Walkability, required: false }
              - { name: architecture, label: Architecture & Beauty, required: false }
              - { name: culture, label: Culture & Atmosphere, required: false }
              - { name: people, label: People & Hospitality, required: false }
              - { name: attractions, label: Attractions & Experiences, required: false }
              - { name: safety, label: Safety & Comfort, required: false }
              - { name: enjoyment, label: Overall Enjoyment, required: false }
      - name: matches
        label: Matches
        widget: list
        required: false
        summary: "{{fields.home}} v {{fields.away}}"
        fields:
          - { name: home, label: Home team }
          - { name: away, label: Away team }
          - { name: score, label: Final score, required: false, hint: "e.g. 2–1" }
          - { name: competition, label: Competition, required: false, hint: "e.g. Premier League" }
          - { name: stadium, label: Stadium, required: false }
          - { name: date, label: Date, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
          - { name: writeUp, label: Write-up, widget: text, required: false, hint: "Your own words about the day" }
      - { name: cover, label: Cover photo, required: false, widget: cover-picker, hint: "Pick one of this visit's photos. Leave blank to use the first photo." }
      - { name: coverFocus, label: Cover framing, required: false, widget: focus-picker, hint: "Click the part of the cover that must stay in view when it's cropped." }
      - { name: photoEdits, label: Photos & videos, required: false, widget: media-manager, hint: "Reorder, hide, delete, rotate, crop and trim. Photo and clip edits apply the next time photos are processed." }
      - name: media
        label: Photo order
        widget: list
        required: false
        hint: "Usually leave this empty: every photo for the city is shown, oldest first. Only list photos (photos/img-1234) to pick and order them by hand; anything not listed is left out."
      - name: mediaMeta
        label: Photo captions
        widget: list
        map_key_field: file
        required: false
        collapsed: true
        summary: "{{fields.file}}"
        hint: "One row per photo or clip you want to caption or hide."
        fields:
          - { name: file, label: Photo or clip, hint: "photos/img-1234 or videos/img-1234 (the name without .jpg/.mov)" }
          - { name: caption, label: Caption, required: false }
          - { name: alt, label: Description for screen readers, required: false, hint: "What's in the photo, for people who can't see it" }
          - { name: hidden, label: Hide this photo (older way), widget: boolean, required: false, hint: "Prefer Show/Hide in Photos & videos above; this switch is kept for older entries" }
          - { name: rotate, label: Rotate, widget: select, required: false, value_type: int, options: [{ label: "90° clockwise", value: 90 }, { label: "180° (upside down)", value: 180 }, { label: "90° anticlockwise", value: 270 }], hint: "For a sideways or upside-down photo. Takes effect the next time the photos are processed." }
          - { name: focus, label: Keep in frame, widget: select, required: false, options: [{ label: Top, value: top }, { label: Upper middle, value: upper }, { label: Centre, value: centre }, { label: Lower middle, value: lower }, { label: Bottom, value: bottom }], hint: "When a cover or thumbnail crops this photo, which part to keep. Leave blank to let the site find the faces." }
      - name: youtube
        label: YouTube videos (unlisted is fine)
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { name: id, label: Video id, hint: "the part after v= in the YouTube link" }
          - { name: title, label: Title }

  - name: places
    label: Places
    label_singular: Place
    description: Every city or region visited, listed once. Add a place before adding a visit to it.
    folder: content/destinations
    slug: "{{city}}"
    format: yaml
    extension: yaml
    identifier_field: city
    create: true
    summary: "{{city}}, {{country}}"
    fields:
      - { name: city, label: City or region, hint: "The place's id (used by visits) is made from this when you first save, e.g. St Moritz becomes st-moritz." }
      - { name: country, label: Country }
      - { name: lat, label: Latitude, widget: number, value_type: float, min: -90, max: 90, step: -1, required: false, hint: "City centre, from a map (e.g. 41.1579). Leave blank for regions (no map pin)." }
      - { name: lng, label: Longitude, widget: number, value_type: float, min: -180, max: 180, step: -1, required: false, hint: "e.g. -8.6291. West of Greenwich is negative." }

  # ---------------------------------------------------------------- Journal
  - name: journal
    label: Journal
    label_singular: Post
    folder: content/journal
    format: frontmatter
    extension: mdx
    identifier_field: title
    create: true
    summary: "{{title}} · {{status}}"
    sortable_fields: [publishedAt, title]
    fields:
      - { name: title, label: Title, hint: "The web address is made from this when you first save." }
      - { name: dek, label: One-line summary, widget: text }
      - name: category
        label: Category
        widget: select
        options: [Bible Study, Faith, Life Lessons, Essays, Engineering, Travel Reflections]
      - { name: series, label: Series, required: false, hint: "e.g. Strangers and pilgrims · Part 1" }
      - { name: tags, label: Tags, widget: list, required: false }
      - name: status
        label: Status
        widget: select
        default: draft
        hint: "The Journal stays hidden from the site until at least one post is Published and Public."
        options: [{ label: "Draft (hidden)", value: draft }, { label: Published, value: published }]
      - name: visibility
        label: Who can read it
        widget: select
        required: false
        default: public
        hint: Only Public posts are published for now. The other options are for future memberships.
        options: [{ label: Public, value: public }, { label: Free subscribers (future), value: free }, { label: Paid members (future), value: paid }, { label: Private, value: private }]
      - { name: publishedAt, label: Published on, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: "Pick a future day to schedule it: a Published post stays hidden until that morning, then appears on its own." }
      - { name: updatedAt, label: Updated on, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
      - { name: sample, label: Sample post, widget: boolean, required: false, hint: "Marks a placeholder post with a Sample label. Leave off for real posts." }
      - { name: footnotes, label: Footnotes, widget: list, required: false, hint: "Mark them in the text with <Fn n={1} />" }
      - { name: questions, label: Study questions, widget: list, required: false }
      - name: body
        label: Post
        widget: text
        hint: >-
          Markdown. Headings start with ##. Scripture: <Scripture k="Hebrews 11:8-10" /> for a full passage,
          <Ref k="Genesis 12:1">Genesis 12:1</Ref> for an inline reference, <Fn n={1} /> for footnote 1,
          <Pull>quote</Pull> for a pull quote. New passages must be added to src/lib/scripture.ts once.

  # ---------------------------------------------------------------- Work
  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    slug: "{{name}}"
    format: yaml
    extension: yaml
    identifier_field: name
    create: true
    summary: "{{name}} · {{status}}"
    fields:
      - { name: name, label: Name }
      - { name: order, label: Display order, widget: number, value_type: int, hint: "1 is shown first" }
      - name: status
        label: Status
        widget: select
        default: draft
        options: [{ label: "Draft (hidden)", value: draft }, { label: Published, value: published }]
      - { name: publishAt, label: Publish on, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: "Optional. Set Status to Published and pick a future day: it stays hidden until that morning, then appears on its own." }
      - { name: kind, label: Type, widget: select, options: [{ label: Case study, value: case-study }, { label: Project, value: project }] }
      - { name: stage, label: Stage, hint: "e.g. In progress" }
      - { name: summary, label: Summary, widget: text }
      - { name: problem, label: Problem, widget: text }
      - { name: approach, label: Approach, widget: text }
      - { name: stack, label: Tech stack, widget: list, hint: "One technology per item, e.g. Next.js 16" }
      - { name: repo, label: GitHub link, type: url, required: false, hint: "Full link, e.g. https://github.com/ojo-john/codequest. Leave blank if the code is private." }
      - { name: repoNote, label: Note when there's no public link, required: false, hint: "e.g. Private repository" }
      - { name: demo, label: Live app link, type: url, required: false, hint: "Full link starting with https://" }
      - { name: demoNote, label: Note next to the live link, required: false, hint: "e.g. Sign-in required" }
      - name: diagram
        label: Data path diagram steps
        widget: list
        required: false
        summary: "{{fields.label}}"
        hint: "The boxes of the diagram on the project page, in order from left to right."
        fields:
          - { name: label, label: Step, hint: "Short name, e.g. Browser editor" }
          - { name: note, label: What it does, widget: text, hint: "One sentence" }

  - name: settings
    label: About me and career
    files:
      - name: site
        label: About me and links
        file: content/site.yaml
        fields:
          - { name: name, label: Name }
          - { name: role, label: Role }
          - { name: company, label: Company }
          - { name: level, label: Level, required: false }
          - { name: intro, label: Home page introduction, widget: text }
          - { name: seoDescription, label: Search result description, widget: text, required: false, hint: "What Google shows under your name. Keep it to 120–160 characters." }
          - { name: github, label: GitHub URL, type: url }
          - { name: linkedin, label: LinkedIn URL, type: url, required: false }
          - { name: email, label: Public contact email, type: email, required: false, hint: "Leave blank to show no email on the site" }
          - { name: resume, label: Résumé PDF, required: false, hint: "Keep as /resume.pdf. The PDF is made from your career timeline by npm run resume:pdf. Leave blank to hide the résumé buttons." }
          - { name: location, label: City on the résumé, required: false, hint: "City and state only, e.g. Dallas, TX. Never a street address." }
          - { name: domain, label: Domain, hint: "johnojo.me" }
          - { name: timeZone, label: Time zone, required: false, default: America/Chicago, hint: "Publish dates switch on at midnight here. e.g. America/Chicago (Dallas)" }
      - name: experience
        label: Career timeline and skills
        file: content/experience.yaml
        fields:
          - name: milestones
            label: Milestones
            widget: list
            summary: "{{fields.label}} · {{fields.title}}"
            hint: "One per new role or promotion, oldest first."
            fields:
              - { name: date, label: Date, pattern: ["^\\d{4}-\\d{2}(-\\d{2})?$", "Use YYYY-MM, e.g. 2025-10"], hint: "YYYY-MM, e.g. 2025-10" }
              - { name: label, label: Label, hint: "e.g. Oct 2025" }
              - { name: title, label: Title }
              - { name: detail, label: Detail }
              - { name: body, label: More detail, widget: text, required: false, hint: "Shown when that year is picked on the Work page" }
              - { name: publishAt, label: Publish on, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: "Optional. Hidden until that day, e.g. to announce a promotion on its start date." }
          - { name: achievementsNote, label: Note under the timeline, widget: text }
          - name: roles
            label: Roles (résumé)
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}} · {{fields.org}}"
            hint: "Newest first. Each role can have sections, one per project or chapter of that job."
            fields:
              - { name: title, label: Job title }
              - { name: org, label: Company }
              - { name: dates, label: Dates as shown, hint: "e.g. Jul 2023 – Present" }
              - { name: location, label: Location, required: false, hint: "City only, e.g. Dallas, TX" }
              - { name: publishAt, label: Publish on, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: "Optional. Hidden until that day, e.g. a new job's start date." }
              - { name: note, label: Note, widget: text, required: false, hint: "e.g. Promoted to SDE II Oct 2025" }
              - name: sections
                label: Sections
                widget: list
                required: false
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Title, hint: "e.g. Platform Migration · Technical Lead" }
                  - { name: dates, label: Dates as shown, required: false, hint: "e.g. Oct 2025 – Present" }
                  - { name: start, label: Started, required: false, pattern: ["^\\d{4}-\\d{2}$", "Use YYYY-MM, e.g. 2023-07"], hint: "YYYY-MM. Used by \"pick a year\" on the Work page." }
                  - { name: end, label: Ended, required: false, pattern: ["^\\d{4}-\\d{2}$", "Use YYYY-MM, e.g. 2025-10"], hint: "YYYY-MM. Leave blank if you're still doing it." }
                  - { name: bullets, label: Bullet points, widget: list, field: { name: bullet, label: Bullet point, widget: text } }
          - name: education
            label: Education
            widget: list
            required: false
            summary: "{{fields.school}}"
            fields:
              - { name: school, label: School }
              - { name: degree, label: Degree }
              - { name: years, label: Years, hint: "e.g. 2019 – 2023" }
          - name: skills
            label: Skills
            widget: list
            summary: "{{fields.group}}"
            fields:
              - { name: group, label: Group, hint: "e.g. Languages" }
              - { name: items, label: Skills, widget: list }
          - { name: featuredSkills, label: Home page tags, widget: list, required: false, hint: "The handful of tags on the home Work panel. Keep it to your most important skills." }
